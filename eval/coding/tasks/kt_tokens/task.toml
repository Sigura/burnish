lang = "kotlin"
file = "solution.kt"
prompt = """
In Kotlin (JVM, standard library only, top-level declarations in the default package), write a tokenizer for a small
filter language like `status == "open" && (priority >= 2 || tag != 'x\\'y')`.

```kotlin
sealed class Token {
    abstract val pos: Int  // 0-based index of the token's first character
    data class Ident(val name: String, override val pos: Int) : Token()
    data class Str(val value: String, override val pos: Int) : Token()
    data class Num(val value: Double, override val pos: Int) : Token()
    data class Op(val symbol: String, override val pos: Int) : Token()
    data class Paren(val open: Boolean, override val pos: Int) : Token()
}
class TokenizeException(message: String, val pos: Int) : Exception(message)
fun tokenize(input: String): List<Token>
```
Declare these exactly as shown.

- Identifiers: `[A-Za-z_][A-Za-z0-9_.]*` (dots allowed after the first char, e.g. `user.name`).
- Numbers: optional leading `-` only when the previous token is absent, an `Op`, or an opening paren; digits with an
  optional fraction (`3`, `2.5`); `.5` and `5.` are errors. A `-` elsewhere is an error (there is no minus operator).
- Strings: single or double quotes; backslash escapes the next character (`\\n` becomes a newline, any other escaped
  character stands for itself). Unterminated strings are errors.
- Operators: `== != <= >= < > && || !` (longest match first). Parentheses `(` `)`.
- Whitespace (space, tab, newline) separates tokens and is skipped.
- Anything else throws `TokenizeException` whose `pos` is the index of the offending character (for an
  unterminated string, the index of its opening quote; for a malformed number such as `5.`, the index of its first
  character).
"""
