prompt = """
This module is used by a calendar service. Users report wrong free/busy results. Find and fix all bugs; keep
the public API (`IntervalSet` with `add`, `remove`, `contains`, `free`, `__iter__`, `__len__`) and semantics:
intervals are half-open `[start, end)` of ints, stored merged (touching intervals like [1,3) and [3,5) merge into
[1,5)) and sorted. Empty intervals (start >= end) are ignored by `add` and `remove`. `free(lo, hi)` returns the gaps
inside `[lo, hi)` not covered by the set, as a list of tuples. `len()` is the number of stored intervals.

```python
import bisect


class IntervalSet:
    def __init__(self, intervals=()):
        self._iv = []
        for s, e in intervals:
            self.add(s, e)

    def add(self, start, end):
        if start > end:
            return
        i = bisect.bisect_left(self._iv, (start, end))
        if i > 0 and self._iv[i - 1][1] > start:
            i -= 1
        j = i
        while j < len(self._iv) and self._iv[j][0] < end:
            start = min(start, self._iv[j][0])
            end = max(end, self._iv[j][1])
            j += 1
        self._iv[i:j] = [(start, end)]

    def remove(self, start, end):
        out = []
        for s, e in self._iv:
            if e <= start or s >= end:
                out.append((s, e))
                continue
            if s < start:
                out.append((s, start))
            if e > end:
                out.append((end, e))
        self._iv = out

    def contains(self, x):
        i = bisect.bisect_left(self._iv, (x, x))
        return i < len(self._iv) and self._iv[i][0] <= x < self._iv[i][1]

    def free(self, lo, hi):
        gaps = []
        cur = lo
        for s, e in self._iv:
            if s > cur:
                gaps.append((cur, s))
            cur = max(cur, e)
        if cur < hi:
            gaps.append((cur, hi))
        return gaps

    def __iter__(self):
        return iter(self._iv)

    def __len__(self):
        return len(self._iv)
```
