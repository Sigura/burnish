lang = "python"
file = "solution.py"
prompt = """
Implement npm-style semantic version ranges.

`parse(v: str) -> Version`: SemVer 2.0.0 `MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]`; no leading zeros in numeric
parts or numeric prerelease identifiers; identifiers `[0-9A-Za-z-]+`, non-empty. A leading `v` or `=` is allowed and
ignored. Invalid input raises `ValueError`. `Version` objects must be totally ordered by SemVer precedence (build
metadata ignored; prerelease < release; prerelease identifiers compared numerically when both numeric, numeric <
alphanumeric, ASCII order otherwise, a shorter prefix list is smaller) and `==` must follow precedence too.

`satisfies(version: str, rng: str) -> bool` and `max_satisfying(versions: list[str], rng: str) -> str | None`
(return the original string). Range grammar:
- A range is one or more comparator sets joined by `||`; it matches if any set matches. A set is
  whitespace-separated comparators that must all match. An empty set or `*` matches any release.
- Comparators: `<`, `<=`, `>`, `>=`, `=` or none, followed by a (possibly partial) version.
- Partial versions / X-ranges: `1`, `1.x`, `1.2.*`, `X`. `1.2.x` means `>=1.2.0 <1.3.0`; `1` means `>=1.0.0 <2.0.0`.
  With operators: `>1.2` means `>=1.3.0`, `<=1.2` means `<1.3.0`, `<1.2` means `<1.2.0`, `>=1.2` means `>=1.2.0`.
- Tilde: `~1.2.3` is `>=1.2.3 <1.3.0`; `~1.2` is `>=1.2.0 <1.3.0`; `~1` is `>=1.0.0 <2.0.0`.
- Caret: `^1.2.3` is `>=1.2.3 <2.0.0`; `^0.2.3` is `>=0.2.3 <0.3.0`; `^0.0.3` is `>=0.0.3 <0.0.4`; `^1.2.x` is
  `>=1.2.0 <2.0.0`; `^0.0.x` is `>=0.0.0 <0.1.0`; `^0.x` is `>=0.0.0 <1.0.0`.
- Hyphen: `1.2.3 - 2.3.4` is `>=1.2.3 <=2.3.4`; a partial upper bound is exclusive of the next: `1.2.3 - 2.3` is
  `>=1.2.3 <2.4.0`; a partial lower bound fills zeros.
- Prereleases: a version with a prerelease only satisfies a set if some comparator in that set has a version with the
  same `MAJOR.MINOR.PATCH` and a prerelease (e.g. `1.2.3-alpha.7` satisfies `>1.2.3-alpha.3` but `3.4.5-alpha.9` does
  not), and it must still satisfy all comparators.
- An invalid range raises `ValueError`.
"""
