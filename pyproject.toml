[project]
name = "burnish"
version = "0.1.0"
description = "Offline English sentence refiner: local LLM (llama.cpp) + LanguageTool, usable from any app."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "llama-cpp-python>=0.3.36",
    "loguru>=0.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
burnish = "burnish.cli:main"
burnish-server = "burnish.server:main"
burnish-hotkey = "burnish.hotkey:main"
burnish-models = "burnish.models:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burnish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
